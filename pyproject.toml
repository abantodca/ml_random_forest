[project]
name = "ml-random-forest"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38,<2",
    "ipykernel==7.3.0",
    "joblib==1.5.2",
    "lightgbm==4.6.0",
    "matplotlib==3.10.6",
    "mlflow==3.12.0",
    "mypy==1.18.2",
    "numpy==2.2.3",
    "openpyxl==3.1.5",
    "optuna==4.8.0",
    "pandas==2.2.3",
    "patsy==1.0.1",
    "plotly==6.3.0",
    "pre-commit==4.4.0",
    "ruff==0.15.13",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "statsmodels>=0.14.4,<0.15",
    "xgboost==3.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".terraform",
    ".ruff_cache",
    "mlruns",
    "artifacts",
    "logs",
    "data",
    "reports",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/**" = ["B008"]
"api/app/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^(artifacts|logs|reports|data|mlruns|\\.terraform)/",
    "^notebooks/",
    "^scripts/experiments/",
]

